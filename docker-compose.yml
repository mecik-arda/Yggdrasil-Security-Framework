services:
  yggdrasil:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-please}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - BEACON_API_KEY=${BEACON_API_KEY:-change-me-beacon-key}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=8080
    volumes:
      - ./logs:/app/logs
      - ./scans:/app/scans
      - ./rag_data:/app/rag_data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - yggdrasil

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - yggdrasil

networks:
  yggdrasil:
    driver: bridge

volumes:
  ollama_data: