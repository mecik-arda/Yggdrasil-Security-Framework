<div id="synScannerModal" class="modal">

                <label style="color:var(--text-color);">Mode:</label>

                    <option value="manual">Manual</option>

                <input type="text" id="synAutoTarget" placeholder="192.168.1.1" style="margin-bottom:10px; width:100%; padding:5px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color);">
                <label style="color:var(--text-color);">Max Port:</label>
                <input type="text" id="synAutoPort" placeholder="1000" style="margin-bottom:15px; width:100%; padding:5px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color);">
            </div>
            <div id="synManualFields" style="display:none;">
                <label style="color:var(--text-color);">Source IP:</label>
                <input type="text" id="synManSource" placeholder="192.168.1.5" style="margin-bottom:10px; width:100%; padding:5px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color);">
                <label style="color:var(--text-color);">Target IP:</label>
                <input type="text" id="synManTarget" placeholder="192.168.1.1" style="margin-bottom:10px; width:100%; padding:5px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color);">

                <input type="text" id="synManStart" placeholder="1" style="margin-bottom:10px; width:100%; padding:5px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color);">
                <label style="color:var(--text-color);">End Port:</label>

<div id="packetInjectorModal" class="modal">

                    <input type="text" id="injectorSrcIp" value="192.168.1.100" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">

                <div style="margin-bottom: 12px; display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label style="color:var(--text-color); font-weight: bold; display: block; margin-bottom: 5px;">Source MAC:</label>
                        <input type="text" id="injectorSrcMac" value="00:00:00:00:00:00" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label style="color:var(--text-color); font-weight: bold; display: block; margin-bottom: 5px;">Destination MAC:</label>
                        <input type="text" id="injectorDstMac" value="ff:ff:ff:ff:ff:ff" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">

                    <input type="number" id="injectorTtl" value="64" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">

                            <input type="number" id="injectorSrcPort" value="4444" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">

                        <div style="flex: 1;">
                            <label style="color:var(--text-color); font-weight: bold; display: block; margin-bottom: 5px;">Dest Port:</label>
                            <input type="number" id="injectorDstPort" placeholder="80" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">
                        </div>
                    </div>
                    <div style="margin-bottom: 12px; display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label style="color:var(--text-color); font-weight: bold; display: block; margin-bottom: 5px;">Seq Number:</label>
                            <input type="number" id="injectorSeq" value="123456789" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">

                            <input type="number" step="0.01" id="injectorRate" value="0.0" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">
                        </div>
                        <div style="flex: 1;">
                            <label style="color:var(--text-color); font-size: 12px; display: block; margin-bottom: 5px;">Count (Total):</label>
                            <input type="number" id="injectorCount" value="1" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">
                        </div>
                    </div>
                    <div style="margin-bottom: 12px; display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label style="color:var(--text-color); font-size: 12px; display: block; margin-bottom: 5px;">Duration (sec):</label>
                            <input type="number" step="0.1" id="injectorDuration" value="0.0" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">

                            <input type="number" id="injectorBurst" value="1" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:1px solid var(--accent-color); box-sizing: border-box;">
                        </div>
                    </div>
                </div>
            </div>
            <button onclick="submitPacketInjector()" class="btn-install" style="width:100%; margin-bottom:10px;">{{ t('execute_runes') }}</button>
            <button onclick="closePacketInjectorModal()" class="btn-cancel" style="width:100%;">{{ t('abort') }}</button>
        </div>
    </div>
