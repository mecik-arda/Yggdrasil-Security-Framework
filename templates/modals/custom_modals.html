<div id="pentestNotesModal" class="modal">
    <div class="modal-content" style="max-width: 800px; width: 95%;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(180, 142, 173, 0.4); padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="color: #b48ead; margin: 0; font-family: 'Cinzel', serif; letter-spacing: 2px;">{{ t('pentest_notes_title') }}</h2>
            <button onclick="closePentestNotesModal()" class="btn-cancel" style="margin: 0; padding: 5px 15px;">✕</button>
        </div>
        <p style="color: var(--text-dim); margin-bottom: 15px;">{{ t('pentest_notes_desc') }}</p>
        <textarea id="pentestNotesArea" style="width: 100%; height: 400px; background: rgba(10, 12, 18, 0.9); color: #a3be8c; border: 1px solid rgba(180, 142, 173, 0.4); border-radius: 4px; padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; resize: vertical;" placeholder="{{ t('pentest_notes_placeholder') }}"></textarea>
    </div>
</div>

<div id="lokiPayloadsModal" class="modal">
    <div class="modal-content" style="max-width: 900px; width: 95%;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(163, 190, 140, 0.4); padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="color: #a3be8c; margin: 0; font-family: 'Cinzel', serif; letter-spacing: 2px;">{{ t('loki_title') }}</h2>
            <button onclick="closeLokiModal()" class="btn-cancel" style="margin: 0; padding: 5px 15px;">✕</button>
        </div>
        <p style="color: var(--text-dim); margin-bottom: 20px;">{{ t('loki_desc') }}</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(163, 190, 140, 0.3); padding: 15px; border-radius: 4px;">
                <label style="display: block; color: #a3be8c; margin-bottom: 8px; font-weight: bold;">{{ t('loki_base_payload') }}</label>
                <textarea id="lokiBasePayload" style="width: 100%; height: 100px; background: var(--bg-dark); color: white; border: 1px solid rgba(163, 190, 140, 0.5); padding: 10px; font-family: monospace;" placeholder="<script>alert(1)</script>"></textarea>
                
                <label style="display: block; color: #a3be8c; margin-top: 15px; margin-bottom: 8px; font-weight: bold;">{{ t('loki_mutations') }}</label>
                <div id="lokiTechniques" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
                    <!-- Populated by JS -->
                </div>
                <button onclick="mutatePayload()" class="btn-install" style="width: 100%; background: #a3be8c; color: var(--bg-dark);">{{ t('loki_btn_mutate') }}</button>
            </div>
            <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(163, 190, 140, 0.3); padding: 15px; border-radius: 4px;">
                <label style="display: block; color: #a3be8c; margin-bottom: 8px; font-weight: bold;">{{ t('loki_results') }}</label>
                <div id="lokiResults" style="height: 250px; overflow-y: auto; background: var(--bg-dark); border: 1px solid rgba(163, 190, 140, 0.5); padding: 10px; font-family: monospace; color: #ebcb8b; white-space: pre-wrap;">
                    
                </div>
            </div>
        </div>
    </div>
</div>

<div id="gtfobinsModal" class="modal">
    <div class="modal-content" style="max-width: 800px; width: 95%;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(208, 135, 112, 0.4); padding-bottom: 15px; margin-bottom: 20px;">
            <h2 style="color: #d08770; margin: 0; font-family: 'Cinzel', serif; letter-spacing: 2px;">{{ t('gtfobins_title') }}</h2>
            <button onclick="closeGtfobinsModal()" class="btn-cancel" style="margin: 0; padding: 5px 15px;">✕</button>
        </div>
        <p style="color: var(--text-dim); margin-bottom: 20px;">{{ t('gtfobins_desc') }}</p>
        
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="gtfobinsSearch" placeholder="{{ t('gtfobins_placeholder') }}" style="flex: 1; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(208, 135, 112, 0.4); color: white; font-size: 16px;">
            <button onclick="fetchGtfobins()" class="btn-install" style="width: auto; margin: 0; background: #d08770; color: var(--bg-dark);">{{ t('gtfobins_btn_search') }}</button>
        </div>
        
        <div id="gtfobinsResults" style="max-height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); border: 1px solid rgba(208, 135, 112, 0.3); padding: 15px; border-radius: 4px; color: #e5e9f0; font-family: monospace;">
            
        </div>
    </div>
</div>

<!-- WIKI MODAL -->
<div id="wikiModal" class="modal">
    <div class="modal-content" style="max-width: 900px; max-height: 80vh; display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(136, 192, 208, 0.2); padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0; color: #b48ead;">📖 {{ t('modal_wiki_title') }}</h2>
            <button onclick="closeWikiModal()" class="btn-cancel" style="margin: 0; padding: 5px 15px;">✕</button>
        </div>
        
        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
            <input type="text" id="wikiSearchInput" placeholder="Aramak istediğin komutu veya işlevi yaz... (Search commands...)" 
                   style="flex: 1; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(180, 142, 173, 0.4); color: white; font-size: 16px; border-radius: 4px;"
                   oninput="filterWiki()">
        </div>

        <div id="wikiResultsContainer" style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 10px;">
            <!-- Dinamik içerik buraya yüklenecek -->
            <div style="text-align: center; color: #88c0d0; padding: 20px;">
                Yükleniyor... (Loading data...)
            </div>
        </div>
    </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(136, 192, 208, 0.2); padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0; color: #88c0d0;">👤 {{ t('modal_profile_title') }}</h2>
            <button onclick="closeProfileModal()" class="btn-cancel" style="margin: 0; padding: 5px 15px;">✕</button>
        </div>
        <div class="form-group">
            <label>NVD API Key</label>
            <input type="password" placeholder="Enter NVD API Key..." class="form-control">
        </div>
        <div class="form-group">
            <label>Shodan API Key</label>
            <input type="password" placeholder="Enter Shodan API Key..." class="form-control">
        </div>
        <button class="btn-submit" onclick="closeProfileModal()" style="width: 100%;">Save Profile</button>
    </div>
</div>
