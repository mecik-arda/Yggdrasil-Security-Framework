name: Tests

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pytest pytest-timeout pytest-cov

    - name: Create .env for tests
      run: |
        echo "SECRET_KEY=test-secret-key-32-chars-long!!" >> .env
        echo "ADMIN_PASSWORD=test-admin-pass" >> .env
        echo "BEACON_API_KEY=test-beacon-key-32-chars!!" >> .env
        echo "FLASK_HOST=127.0.0.1" >> .env

    - name: Syntax check (compileall)
      run: python -m compileall -q app.py core routes handlers yggapp tests

    - name: Lint check (critical errors only)
      run: flake8 app.py core routes handlers yggapp tests --count --select=E9,F7,F82 --show-source --statistics

    - name: Run pytest (full suite)
      run: pytest tests/ -v --tb=short --timeout=60 --cov=. --cov-report=xml -p no:cacheprovider --ignore=tests/test_db.py --ignore=tests/test_logger.py --ignore=tests/test_task_manager.py

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
      continue-on-error: true